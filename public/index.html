<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Getränkekarte</title>
<style>
:root{--bg:#E9EEF0;--card:#F7FAFB;--ink:#14232B;--mute:#586870;--accent:#C8341F;--onacc:#fff;--line:#c4d0d5;
--hd:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--tx:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A1F;--card:#172429;--ink:#E6EEF1;--mute:#93A4AC;--accent:#FF6B52;--onacc:#1a0a06;--line:#2a3b42}}
:root[data-theme="dark"]{--bg:#0F1A1F;--card:#172429;--ink:#E6EEF1;--mute:#93A4AC;--accent:#FF6B52;--onacc:#1a0a06;--line:#2a3b42}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.45 var(--tx)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{max-width:760px;margin:0 auto;padding:36px 20px 12px}
h1{font:800 clamp(40px,10vw,72px)/.95 var(--hd);letter-spacing:-.03em;margin:0 0 6px;outline:none}
h1[contenteditable=true]{border-bottom:2px dashed var(--accent)}
.sub{color:var(--mute);margin:0}
main{max-width:760px;margin:0 auto;padding:8px 20px 80px}
section{margin-top:40px}
h2{font:800 clamp(28px,6vw,40px)/1 var(--hd);letter-spacing:-.02em;margin:0 0 6px;color:var(--accent)}
ul{list-style:none;margin:0;padding:0}
.it{padding:16px 0;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:baseline;gap:10px}
.nm{font:500 20px/1.2 var(--hd);font-weight:700}
.dots{flex:1;border-bottom:2px dotted var(--mute);min-width:16px;transform:translateY(-4px);opacity:.6}
.pr{font:700 19px var(--hd);font-variant-numeric:tabular-nums;white-space:nowrap}
.ds{margin:4px 0 0;color:var(--mute);max-width:60ch}
.meta{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.tag{border:1px solid var(--mute);border-radius:6px;padding:0 7px}
.out .nm,.out .pr,.out .ds{text-decoration:line-through;opacity:.5}
.out .meta::after{content:"Ausverkauft";color:var(--accent);font-weight:500}
.act{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:8px;padding:6px 12px;font-size:15px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--onacc);font-weight:500}
.btn.del{border-color:var(--accent);color:var(--accent)}
.empty{color:var(--mute);padding:40px 0;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;background:var(--bg);border-top:1px solid var(--line);z-index:6}
.bar[hidden]{display:none}
dialog{border:0;border-radius:14px;padding:0;background:var(--card);color:var(--ink);width:min(520px,92vw);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dh{font:800 24px var(--hd);padding:18px 20px 0}
#db{padding:12px 20px;display:grid;gap:10px;max-height:60vh;overflow:auto}
#db label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
#db input,#db select,#db textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink)}
#db textarea{min-height:240px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
.da{display:flex;gap:8px;justify-content:flex-end;padding:0 20px 18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tg{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink)!important;font-size:16px!important}
.tg label{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:16px}
body.tv{overflow:hidden;cursor:none;user-select:none}
body.tv #stage{width:720px;position:absolute;left:0;top:0;transform-origin:top left}
body.tv header{max-width:none;padding:32px 32px 0}
body.tv main{max-width:none;padding:0 32px 40px}
body.tv h1{font-size:68px}
body.tv .sub{font-size:15px}
body.tv section{margin-top:30px}
body.tv .it{padding:12px 0}
@media print{nav,.tools,.bar,.act{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div id="stage">
<header>
  <h1 id="title" spellcheck="false"></h1>
  <p class="sub">Alle Preise in Euro inkl. MwSt. Fragt uns nach Allergenen.</p>
</header>
<main id="list"></main>
</div>
<div class="bar" id="bar" hidden>
  <button class="btn" id="edit" aria-pressed="false">Bearbeiten</button>
  <button class="btn pri" id="add" hidden>Getränk hinzufügen</button>
  <button class="btn" id="addcat" hidden>Kategorie hinzufügen</button>
  <button class="btn" id="data" hidden>Daten sichern / laden</button>
  <button class="btn" id="logout" hidden>Abmelden</button>
</div>
<dialog id="dlg"><div class="dh" id="dt"></div><div id="db"></div><div class="da"><button class="btn" id="cancel">Abbrechen</button><button class="btn pri" id="ok">Speichern</button></div></dialog>

<script>
const TV=location.hash!=="#admin";
if(TV){document.body.classList.add("tv");document.documentElement.dataset.theme="dark"}
let S={title:"Getränkekarte",cats:[],items:[]},cat="all",edit=false,admin=false,onOk=null;
let lastJson="";
function fetchMenu(){return fetch("/api/menu").then(r=>r.json()).then(d=>{const j=JSON.stringify(d);if(j===lastJson)return;lastJson=j;S=d;render()}).catch(()=>{})}
function save(){fetch("/api/menu",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(S)}).then(r=>{
  if(r.status===401){admin=false;edit=false;render();alert("Du bist nicht mehr angemeldet. Bitte melde dich erneut an.")}
  else if(!r.ok){alert("Speichern fehlgeschlagen. Die Karte wird neu geladen.");fetchMenu()}
}).catch(()=>alert("Keine Verbindung zum Server."))}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur=n=>Number(n).toFixed(2).replace(".",",")+" €";

function render(){
  if(cat!=="all"&&!S.cats.includes(cat))cat="all";
  $("title").textContent=S.title;
  $("title").contentEditable=edit;
  let html="";
  S.cats.forEach(c=>{
    if(cat!=="all"&&cat!==c)return;
    const its=S.items.filter(i=>i.cat===c);
    if(!its.length&&!edit)return;
    html+=`<section><h2>${esc(c)}</h2>${edit?`<div class="act"><button class="btn" data-a="cren" data-c="${esc(c)}">Umbenennen</button><button class="btn" data-a="cup" data-c="${esc(c)}">Nach oben</button><button class="btn" data-a="cdn" data-c="${esc(c)}">Nach unten</button><button class="btn del" data-a="cdel" data-c="${esc(c)}">Kategorie löschen</button></div>`:""}<ul>`+its.map(i=>`<li class="it${i.out?" out":""}"><div class="row"><span class="nm">${esc(i.name)}</span><span class="dots"></span><span class="pr">${eur(i.price)}</span></div>${i.desc?`<p class="ds">${esc(i.desc)}</p>`:""}<div class="meta">${i.size?`<span>${esc(i.size)}</span>`:""}${i.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>${edit?`<div class="act"><button class="btn" data-a="edit" data-id="${i.id}">Ändern</button><button class="btn" data-a="out" data-id="${i.id}">${i.out?"Wieder verfügbar":"Ausverkauft"}</button><button class="btn del" data-a="del" data-id="${i.id}">Löschen</button></div>`:""}</li>`).join("")+`</ul></section>`;
  });
  $("list").innerHTML=html||`<p class="empty">${TV?"Die Karte wird gerade aktualisiert.":"Noch keine Getränke. Wähle „Bearbeiten“, um welche hinzuzufügen."}</p>`;
  $("edit").textContent=edit?"Fertig":"Bearbeiten";
  $("edit").setAttribute("aria-pressed",edit);
  $("add").hidden=$("addcat").hidden=$("data").hidden=!edit;
  $("logout").hidden=!admin;
  if(TV)fit();
}
function dlg(title,body,ok){$("dt").textContent=title;$("db").innerHTML=body;onOk=ok;$("dlg").showModal()}
function itemForm(it){
  it=it||{cat:S.cats[0],name:"",desc:"",price:"",size:"",tags:[]};
  dlg(it.id?"Getränk ändern":"Neues Getränk",
  `<label>Name<input id="f-n" value="${esc(it.name)}"></label>
   <label>Beschreibung<input id="f-d" value="${esc(it.desc)}"></label>
   <div class="two"><label>Preis in €<input id="f-p" inputmode="decimal" value="${it.price===""?"":String(it.price).replace(".",",")}"></label>
   <label>Größe<input id="f-s" value="${esc(it.size)}" placeholder="z. B. 0,3 l"></label></div>
   <label>Kategorie<select id="f-c">${S.cats.map(c=>`<option${c===it.cat?" selected":""}>${esc(c)}</option>`).join("")}</select></label>
   <div class="tg"><label><input type="checkbox" id="f-a"${it.tags.includes("alkoholfrei")?" checked":""}> alkoholfrei</label><label><input type="checkbox" id="f-v"${it.tags.includes("vegan")?" checked":""}> vegan</label></div>`,
  ()=>{
    const name=$("f-n").value.trim(),price=parseFloat($("f-p").value.replace(",","."));
    if(!name||isNaN(price)){alert("Bitte Name und einen gültigen Preis eingeben.");return false}
    const tags=[];if($("f-a").checked)tags.push("alkoholfrei");if($("f-v").checked)tags.push("vegan");
    const o={name,desc:$("f-d").value.trim(),price,size:$("f-s").value.trim(),cat:$("f-c").value,tags};
    if(it.id)Object.assign(S.items.find(x=>x.id===it.id),o);else S.items.push({id:Date.now(),...o});
    return true});
}
function catForm(old){
  dlg(old?"Kategorie umbenennen":"Neue Kategorie",`<label>Name<input id="f-k" value="${esc(old||"")}"></label>`,()=>{
    const n=$("f-k").value.trim();
    if(!n){alert("Bitte einen Namen eingeben.");return false}
    if(S.cats.includes(n)&&n!==old){alert("Diese Kategorie gibt es schon.");return false}
    if(old){S.cats[S.cats.indexOf(old)]=n;S.items.forEach(i=>{if(i.cat===old)i.cat=n});if(cat===old)cat=n}else S.cats.push(n);
    return true});
}
function catAct(a,c){
  const i=S.cats.indexOf(c);
  if(a==="cren")catForm(c);
  if(a==="cup"&&i>0){[S.cats[i-1],S.cats[i]]=[S.cats[i],S.cats[i-1]];save();render()}
  if(a==="cdn"&&i<S.cats.length-1){[S.cats[i+1],S.cats[i]]=[S.cats[i],S.cats[i+1]];save();render()}
  if(a==="cdel"){const n=S.items.filter(x=>x.cat===c).length;
    dlg("Kategorie „"+c+"“ löschen?","<p>"+(n?"Die "+n+" Getränke in dieser Kategorie werden ebenfalls gelöscht.":"Die Kategorie ist leer.")+"</p>",()=>{S.cats.splice(S.cats.indexOf(c),1);S.items=S.items.filter(x=>x.cat!==c);return true})}
}
$("edit").onclick=()=>{if(edit){edit=false;render()}else if(admin){edit=true;render()}else login()};
$("title").onblur=()=>{if(edit){S.title=$("title").textContent.trim()||"Getränkekarte";save()}};
$("add").onclick=()=>{if(!S.cats.length){alert("Lege zuerst eine Kategorie an.");return}itemForm()};
$("addcat").onclick=()=>catForm();
$("list").onclick=e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  if(b.dataset.c!==undefined){catAct(b.dataset.a,b.dataset.c);return}
  const id=+b.dataset.id,it=S.items.find(x=>x.id===id);
  if(b.dataset.a==="edit")itemForm(it);
  if(b.dataset.a==="out"){it.out=!it.out;save();render()}
  if(b.dataset.a==="del"){dlg("„"+it.name+"“ löschen?","<p>Das Getränk wird endgültig von der Karte entfernt.</p>",()=>{S.items=S.items.filter(x=>x.id!==id);return true})}
};
$("data").onclick=()=>dlg("Daten sichern / laden",`<label>Kopiere diesen Text zur Sicherung oder füge gesicherte Daten ein und wähle „Speichern“.<textarea id="f-j" spellcheck="false">${esc(JSON.stringify(S,null,1))}</textarea></label>`,()=>{
  try{const d=JSON.parse($("f-j").value);if(!d.items||!d.cats)throw 0;S=d;return true}catch(e){alert("Die Daten sind ungültig.");return false}});
$("ok").onclick=()=>{if(onOk&&onOk()===false)return;save();$("dlg").close();render()};
$("cancel").onclick=()=>$("dlg").close();
function login(){dlg("Anmelden",`<label>Passwort<input id="f-pw" type="password" autocomplete="current-password"></label>`,()=>{
  fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("f-pw").value})})
   .then(r=>{if(r.ok){admin=true;edit=true;$("dlg").close();render()}else alert("Das Passwort ist falsch.")})
   .catch(()=>alert("Keine Verbindung zum Server."));
  return false})}
$("logout").onclick=()=>{fetch("/api/logout",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}).finally(()=>{admin=false;edit=false;render()})};
$("bar").hidden=TV;
window.addEventListener("hashchange",()=>location.reload());
let tvScale=1,tvX=0,over=0,sy=0,hold=0,prev=0,atEnd=false;
function place(y){$("stage").style.transform="translate("+tvX+"px,"+(-y)+"px) scale("+tvScale+")"}
function fit(){
  const st=$("stage");st.style.transform="none";
  const w=innerWidth,h=innerHeight,ch=st.offsetHeight||1,sw=w/720,sf=h/ch;
  let s=Math.min(sw,sf);over=0;
  if(sf<sw*0.6){s=sw*0.6;over=ch*s-h}
  tvScale=s;tvX=(w-720*s)/2;sy=0;atEnd=false;hold=performance.now()+6000;place(0);
}
function tick(t){
  requestAnimationFrame(tick);
  const dt=Math.min((t-prev)/1000,.1);prev=t;
  if(!over||t<hold)return;
  if(atEnd){sy=0;atEnd=false;hold=t+6000;place(0);return}
  sy+=dt*40;
  if(sy>=over){sy=over;atEnd=true;hold=t+6000}
  place(sy);
}
if(TV){window.addEventListener("resize",fit);requestAnimationFrame(tick);setTimeout(()=>location.reload(),6*3600*1000)}
fetch("/api/me").then(r=>r.json()).then(d=>{admin=!!d.admin;render()}).catch(()=>{});
fetchMenu();
setInterval(()=>{if(!edit&&!$("dlg").open)fetchMenu()},TV?30000:60000);
</script>
</body>
</html>
